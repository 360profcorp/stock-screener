name: Diag trader state (read-only, audit branch only)
on:
  push:
    branches: [audit/trader-diag]
    paths: ["scripts/diag/dump.py", ".github/workflows/diag-trader-state.yml"]
permissions:
  contents: write
jobs:
  diag:
    if: github.ref == 'refs/heads/audit/trader-diag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use main's current state (read-only copy)
        run: git fetch origin main && git show origin/main:state/trader.enc > state/trader.enc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography requests
      - env:
          STATE_PASSWORD: ${{ secrets.STATE_PASSWORD }}
        run: python scripts/diag/dump.py
      - name: Commit the encrypted dump to this audit branch only
        run: |
          git config user.name "visar-audit"; git config user.email "visar-audit@users.noreply.github.com"
          git checkout -- state/trader.enc
          git add scripts/diag/out.bin && git commit -m "diag: encrypted read-only state dump" && git push origin HEAD:audit/trader-diag
