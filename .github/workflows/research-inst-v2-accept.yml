name: Research institutional v2 — EDGAR acceptance times (research branch only)

# CORRECTION_V2.md §3. Read-only EDGAR requests; no orders, no paper/state writes.
on:
  push:
    branches: [research/institutional-v2]
    paths: ["research/institutional_v2/RUN_ACCEPT"]

permissions:
  contents: write
  actions: read

concurrency:
  group: research-inst-v2
  cancel-in-progress: false

jobs:
  accept:
    if: github.ref == 'refs/heads/research/institutional-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2.0" numpy requests lxml
      - id: src
        run: echo "run=$(head -1 research/institutional_v2/RUN_ACCEPT)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: v2src-${{ steps.src.outputs.run }}
          run-id: ${{ steps.src.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/src
      - name: Acceptance times
        run: |
          set +e
          python -m research.institutional_v2.accept --src "${{ runner.temp }}/src" --out dist/v2acc > a.log 2>&1; rc=$?
          tail -50 a.log
          [ $rc -eq 0 ] || python -c "t=open('a.log').read()[-3000:].replace('%','%25').replace('\n','%0A'); print('::error title=accept::'+t)"
          exit $rc
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2acc-${{ github.run_id }}
          path: dist/v2acc
          retention-days: 90
      - name: Commit summary
        if: always()
        run: |
          d=research/results/institutional_v2/accept/${{ github.run_id }}
          mkdir -p $d; cp dist/v2acc/accept.json dist/v2acc/calibration.csv $d/ 2>/dev/null || true
          git config user.name "visar-research"; git config user.email "visar-research@users.noreply.github.com"
          git add research/results/institutional_v2 || true
          git diff --cached --quiet || git commit -m "Institutional v2: acceptance times ${{ github.run_id }}"
          git pull --rebase -q && git push
