name: Research institutional v1 — backtest (research branch only)

# PREREG_INSTITUTIONAL.md. Uses the 10-year bars (run 40152515701) and the SEC tables of the
# build run named in research/institutional/SEC_RUN. No orders, no paper/state writes.
on:
  push:
    branches: [research/institutional-ai-v1]
    paths: ["research/institutional/run.py", "research/institutional/test_run.py",
            "research/institutional/SEC_RUN", ".github/workflows/research-institutional-run.yml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: research-institutional-run
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/research/institutional-ai-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2.0" numpy requests "yfinance>=0.2.40" lxml
      - name: Tests
        run: python -m unittest research.institutional.test_run research.institutional.test_sec_data test_portfolio_bt
      - name: Live strategy fingerprint unchanged
        run: python -c "from paper import store; fp=store.code_fingerprint()['combined']; print(fp); assert fp=='17454c61f631'"
      - id: sec
        run: if [ -f research/institutional/SEC_RUN ]; then echo "run=$(cat research/institutional/SEC_RUN)" >> "$GITHUB_OUTPUT"; fi
      - name: 10-year bars
        if: steps.sec.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: shorts10y-dataset-40152515701
          run-id: 40152515701
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ds
      - name: SEC tables
        if: steps.sec.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: sec-inst-${{ steps.sec.outputs.run }}
          run-id: ${{ steps.sec.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/sec
      - name: Backtest
        if: steps.sec.outputs.run != ''
        run: |
          set +e
          python -m research.institutional.run --dataset "${{ runner.temp }}/ds" --sec "${{ runner.temp }}/sec" > r.log 2>&1; rc=$?
          tail -40 r.log
          [ $rc -eq 0 ] || python -c "t=open('r.log').read()[-3000:].replace('%','%25').replace('\n','%0A'); print('::error title=inst::'+t)"
          exit $rc
      - name: Live state untouched
        run: git diff --exit-code HEAD -- paper state trader.py core.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "visar-research"; git config user.email "visar-research@users.noreply.github.com"
          git add research/results/institutional || true
          git diff --cached --quiet || git commit -m "Institutional v1: backtest $(date -u +%F_%H%M)"
          git pull --rebase -q && git push
