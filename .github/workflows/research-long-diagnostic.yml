name: Research long diagnostic 10Y (research branch only)

# research/long_diagnostic/PLAN.md. Uses the 10-year bars of dataset run 40152515701 (no new
# download). Read-only diagnostics; never touches paper/, state/ or the bot.
on:
  push:
    branches: [research/long-diagnostic-10y]
    paths: ["research/long_diagnostic/RUN"]

permissions:
  contents: write
  actions: read

concurrency:
  group: research-long-diagnostic
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/research/long-diagnostic-10y'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2.0" numpy "yfinance>=0.2.40" lxml requests matplotlib
      - name: Tests (diagnostic + unchanged engines)
        run: python -m unittest research.long_diagnostic.test_diagnostic research.crisis.test_crisis test_portfolio_bt test_task6_engine
      - name: Live strategy fingerprint unchanged
        run: python -c "from paper import store; fp=store.code_fingerprint()['combined']; print(fp); assert fp=='17454c61f631'"
      - name: 10-year bars
        uses: actions/download-artifact@v4
        with:
          name: shorts10y-dataset-40152515701
          run-id: 40152515701
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ds
      - name: Diagnostic
        run: |
          set +e
          python -m research.long_diagnostic.run --dataset "${{ runner.temp }}/ds" \
            --reference research/results/crisis/runs/2026-10-25T0255Z/results.json > r.log 2>&1; rc=$?
          tail -60 r.log
          [ $rc -eq 0 ] || python -c "t=open('r.log').read()[-3000:].replace('%','%25').replace('\n','%0A'); print('::error title=diagnostic::'+t)"
          exit $rc
      - name: Live state untouched
        if: always()
        run: git diff --exit-code HEAD -- paper state trader.py core.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "visar-research"; git config user.email "visar-research@users.noreply.github.com"
          git add research/results/long_diagnostic || true
          git diff --cached --quiet || git commit -m "Research long diagnostic 10Y: run $(date -u +%F_%H%M)"
          git pull --rebase -q && git push
