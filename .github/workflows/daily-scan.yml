name: Daily scan

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "yfinance>=0.2.40" "pandas>=2.0" numpy lxml requests
      - name: Scan S&P 500 and send push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # ---- Настройки автоскана (журнал записывается по ним) ----
          MIN_RS: "85"        # мин. относительная сила, 0–99
          MIN_VOL: "0"        # мин. объём к среднему за 20 дней (1.5 = в 1.5 раза выше), 0 = без фильтра
          STOP_BUF: "3"       # запас стопа под уровнем, %
          MAX_RISK: "0"       # пропускать сигналы со стопом дальше этого %, 0 = без ограничения
          LOOKBACK: "3"       # сколько свечей пробивать: 2 или 3
          REPEAT_DAYS: "10"   # не записывать ту же акцию в тот же сетап повторно N торговых дней, 0 = каждый день
          MARKET_FILTER: "ma50"
        run: python daily_scan.py
      - name: Save journal
        run: |
          git config user.name "visar-bot"
          git config user.email "visar-bot@users.noreply.github.com"
          git add journal/signals.csv || true
          git diff --cached --quiet || git commit -m "Journal: signals $(date -u +%F)"
          git push
