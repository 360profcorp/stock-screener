name: Daily scan

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "yfinance>=0.2.40" "pandas>=2.0" numpy lxml requests
      - name: Scan S&P 500 and send push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_RS: "70"
        run: python daily_scan.py
      - name: Save journal
        run: |
          git config user.name "visar-bot"
          git config user.email "visar-bot@users.noreply.github.com"
          git add journal/signals.csv || true
          git diff --cached --quiet || git commit -m "Journal: signals $(date -u +%F)"
          git push
