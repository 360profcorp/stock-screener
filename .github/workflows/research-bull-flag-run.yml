name: Research bull flag v1.1 historical run (research branch only)

# PREREG_BULLFLAG_v1 v1.1, approved by Muse. Exploratory run on the frozen PR #5 dataset
# (artifact of run 38773034101). No Yahoo download, no schedule, never touches paper/ or state/.
on:
  push:
    branches: [research/bull-flag-v1]
    paths: ["research/bull_flag/run.py", ".github/workflows/research-bull-flag-run.yml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: research-bull-flag-run
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/research/bull-flag-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2.0" numpy "yfinance>=0.2.40" lxml requests
      - name: Live strategy fingerprint unchanged
        run: python -c "from paper import store; fp=store.code_fingerprint()['combined']; print(fp); assert fp=='17454c61f631'"
      - name: Synthetic tests
        run: python -m unittest research.bull_flag.test_bull_flag
      - name: Frozen PR 5 dataset
        uses: actions/download-artifact@v4
        with:
          name: sp1500-dataset-38773034101
          run-id: 38773034101
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/pr5
      - name: Historical run
        run: python -m research.bull_flag.run --dataset "${{ runner.temp }}/pr5"
      - name: Live state untouched
        run: |
          # tracked files unchanged, and no new files apart from Python bytecode caches
          git diff --exit-code HEAD -- paper state trader.py core.py
          left=$(git status --porcelain --untracked-files=all -- paper state trader.py core.py | grep -v '__pycache__/' || true)
          echo "$left"; test -z "$left"
      - name: Reproducible (identical to every earlier run, apart from run id and git rev)
        run: |
          python - <<'PY'
          import json, glob
          rs = sorted(glob.glob("research/results/bull_flag/runs/*/results.json"))
          base = json.load(open(rs[0]))
          for r in rs[1:]:
              assert json.load(open(r)) == base, r
          print(len(rs), "runs identical")
          PY
      - name: Commit results
        if: always()
        run: |
          git config user.name "visar-research"
          git config user.email "visar-research@users.noreply.github.com"
          git add research/results/bull_flag || true
          git diff --cached --quiet || git commit -m "Research bull flag v1.1: historical run $(date -u +%F_%H%M)"
          git pull --rebase && git push
