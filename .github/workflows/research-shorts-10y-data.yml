name: Research shorts 10y dataset (research branch only)

# Research only: unit tests + one real-data run of research/sp1500 on the research branch.
# No schedule, no orders, never touches paper/state or paper/data. Results are committed to
# research/results/sp1500/runs/<run_id>/; the full dataset is uploaded as an artifact.
on:
  push:
    branches: [research/shorts-10y]
    paths:
      - ".github/workflows/research-shorts-10y-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-shorts-10y-data
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/research/shorts-10y'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.40" "pandas>=2.0" numpy lxml requests html5lib beautifulsoup4
      - name: Unit tests (research + unchanged production suites)
        run: python -m unittest research.sp1500.test_sp1500 test_paper test_task6_engine test_portfolio_bt -v
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Source probe only (commit message contains [probe])
        if: contains(github.event.head_commit.message, '[probe]')
        run: python -m research.sp1500.run --probe
      - name: Price cache (same-day reruns do not hit Yahoo again)
        uses: actions/cache@v4
        with:
          path: .cache/sp1500
          key: shorts10y-prices-${{ steps.day.outputs.d }}-${{ github.run_id }}
          restore-keys: shorts10y-prices-${{ steps.day.outputs.d }}-
      - name: Real-data research run
        if: "!contains(github.event.head_commit.message, '[probe]')"
        run: python -m research.sp1500.run --period 10y --shorts-only
      - name: Upload dataset (signals, raw sources, bars)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts10y-dataset-${{ github.run_id }}
          path: dist/sp1500
          if-no-files-found: warn
          retention-days: 90
      - name: Commit run summary
        if: always()
        run: |
          git config user.name "visar-research"
          git config user.email "visar-research@users.noreply.github.com"
          git add research/results/sp1500 || true
          git diff --cached --quiet || git commit -m "Research shorts 10y: dataset run $(date -u +%F_%H%M)"
          git pull --rebase && git push
